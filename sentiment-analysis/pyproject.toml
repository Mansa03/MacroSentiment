[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-analysis"
version = "0.1.0"
description='A sample Python package'
authors = [{name = "Wini Akam", email = "winignatius43@gmail.com"},]
dependencies = [
    'pytest',
    'playwright',
    'playwright-stealth',
    'polars',
    'torch',
    'trafilatura',
    'dbt-postgres',
    'dbt-duckdb',
    'redis',
    'logging',
    'huggingface-hub',
    'transformers',
    'langchain-text-splitters',
    'gliner',
    'dependency-injector == 4.49.0',
    'psycopg == 3.3.0',
    'psycopg[binary]',
    'apache-airflow==3.2.1']
requires-python = ">= 3.12"