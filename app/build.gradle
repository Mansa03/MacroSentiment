plugins {
    id 'java'
    id 'application'
    id 'io.freefair.lombok' version '9.1.0'
    id 'jacoco'
}

application {
    mainClass = 'com.mirror.NewsIngestionService'
}

repositories {
    mavenCentral()
}

configurations {
     mockitoAgent
 }


dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.google.guava:guava:32.1.2-jre'
    implementation 'com.google.dagger:dagger:2.59.1'
    implementation 'org.slf4j:slf4j-api:2.0.7'
    implementation 'ch.qos.logback:logback-classic:1.5.6'
    implementation 'org.immutables:value:2.9.0'
    implementation 'redis.clients:jedis:7.2.0'
    implementation 'org.postgresql:postgresql:42.7.3'
    implementation 'com.zaxxer:HikariCP:7.0.2'
    annotationProcessor 'com.google.dagger:dagger-compiler:2.59.1'
    annotationProcessor "org.immutables:value:2.9.0"
    testImplementation 'org.slf4j:slf4j-api:2.0.7'
    testImplementation 'ch.qos.logback:logback-classic:1.5.6'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    testImplementation 'redis.clients:jedis:7.2.0'
    testImplementation 'com.zaxxer:HikariCP:7.0.2'
    testImplementation(testLibs.mockito.core)
    mockitoAgent(testLibs.mockito.core) { isTransitive = false }
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


test {
    useJUnitPlatform()
    finalizedBy tasks.jacocoTestReport
}

jacoco {
    toolVersion = "0.8.9" // or latest stable
}

tasks.jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    'com/mirror/dagger/**'
            ])
        }))
    }
}

tasks.jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.80 // 80% coverage
            }
        }
        rule {
            enabled = true
            excludes = ['com.mirror.dagger.*']
        }
    }
}


